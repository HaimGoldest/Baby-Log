<!-- The press lives on the wrapper, not the button: the button has rounded
     corners, and hit testing honours border-radius, so a right-click in a
     corner (or in the gap around the item) lands here and would otherwise
     reach the browser's own context menu. -->
<div
  class="panel-item"
  [class.is-filtered]="isFiltered()"
  appLongPress
  (longPress)="openMenu()"
>
  <button
    type="button"
    class="tile-button"
    (click)="addBabyEvent('')"
    aria-haspopup="menu"
  >
    <app-category-icon
      class="tile"
      [category]="babyEventCategory().category"
    ></app-category-icon>
    <span class="tile-label">{{ babyEventCategory().category.value }}</span>
  </button>

  <span
    class="menu-anchor"
    [matMenuTriggerFor]="menu"
    (menuOpened)="onMenuOpened()"
    (menuClosed)="onMenuClosed()"
  ></span>

  <mat-menu #menu="matMenu" class="notes-menu">
    @for (comment of comments(); track $index) {
      <button mat-menu-item type="button" (click)="addBabyEvent(comment)">
        {{ comment }}
      </button>
    }

    @if (comments().length) {
      <mat-divider></mat-divider>
    }

    <button mat-menu-item type="button" (click)="filterEvent()">
      <mat-icon>{{ filterIcon() }}</mat-icon>
      <span>{{ filterLabel() }}</span>
    </button>
  </mat-menu>
</div>
