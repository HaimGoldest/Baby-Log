<mat-card appearance="outlined" class="favorite-card">
  <div class="card-header">
    <app-category-icon [category]="favorite().category"></app-category-icon>

    <h3 class="category-title">{{ favorite().category.value }}</h3>

    <div class="order-controls">
      <button
        mat-icon-button
        type="button"
        [disabled]="isFirst()"
        [matTooltip]="strings.MOVE_UP"
        [attr.aria-label]="strings.MOVE_UP"
        (click)="moveUp.emit()"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>

      <button
        mat-icon-button
        type="button"
        [disabled]="isLast()"
        [matTooltip]="strings.MOVE_DOWN"
        [attr.aria-label]="strings.MOVE_DOWN"
        (click)="moveDown.emit()"
      >
        <mat-icon>arrow_downward</mat-icon>
      </button>
    </div>
  </div>

  <div class="comments-section">
    @for (comment of favorite().comments; track comment.id) {
      <div class="comment-row">
        <mat-form-field appearance="outline" class="comment-field">
          <mat-label>{{ strings.COMMENT }}</mat-label>
          <input
            matInput
            [value]="comment.text"
            [attr.maxlength]="maxNoteLength"
            (input)="onCommentInput(comment.id, $event.target)"
          />
          <mat-hint align="end">
            {{ comment.text.length }}/{{ maxNoteLength }}
          </mat-hint>
        </mat-form-field>

        <button
          mat-icon-button
          type="button"
          class="app-danger-action remove-comment"
          [matTooltip]="strings.REMOVE_COMMENT"
          [attr.aria-label]="strings.REMOVE_COMMENT"
          (click)="removeComment.emit(comment.id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    } @empty {
      <p class="no-comments">{{ strings.NO_COMMENTS }}</p>
    }
  </div>

  <div class="card-footer">
    <button mat-button type="button" (click)="addComment.emit()">
      <mat-icon>add</mat-icon>
      <span>{{ strings.ADD_COMMENT }}</span>
    </button>

    <button
      mat-button
      type="button"
      class="app-danger-action"
      (click)="remove.emit()"
    >
      <mat-icon>star_border</mat-icon>
      <span>{{ strings.REMOVE_FAVORITE }}</span>
    </button>
  </div>
</mat-card>
