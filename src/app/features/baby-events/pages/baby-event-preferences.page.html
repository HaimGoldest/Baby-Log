<div class="container-fluid">
  <div class="container">
    <h2 class="text-center">{{ strings.HEADER }}</h2>
    @for (item of babyEventsCategories(); track item.category.id) {
    <app-baby-event-preferences-item
      [babyEventCategory]="item"
      (modified)="onChanged()"
    ></app-baby-event-preferences-item>
    }

    <div class="action-buttons">
      <button
        mat-fab
        [class.save]="hasChanged"
        [disabled]="!hasChanged"
        (click)="save()"
      >
        {{ strings.SAVE }}
      </button>
      <button mat-button (click)="cancel()">{{ strings.CANCEL }}</button>
    </div>
  </div>
</div>
