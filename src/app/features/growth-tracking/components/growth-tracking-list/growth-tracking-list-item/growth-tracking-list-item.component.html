@let pending = pendingKind();
@let item = measurement();

<span class="date-cell" role="cell">
  <span class="date-pill">{{ item.date | date: "dd/MM/yy" }}</span>
  @if (pending === 'syncing') {
    <app-sync-pending-icon></app-sync-pending-icon>
  }
</span>
<span class="value" role="cell">{{ item.weight ?? '-' }}</span>
<span class="value" role="cell">{{ item.height ?? '-' }}</span>
<span class="value" role="cell">{{ item.headMeasure ?? '-' }}</span>

<span role="cell">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    [disabled]="pending === 'saving'"
    [attr.aria-label]="strings.ACTIONS"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button
      mat-menu-item
      [disabled]="pending !== null"
      (click)="openEditMeasurementForm()"
    >
      <mat-icon>edit</mat-icon>
      <span>{{ strings.EDIT }}</span>
    </button>
    <button
      mat-menu-item
      class="app-danger-action"
      [disabled]="pending !== null"
      (click)="onDelete()"
    >
      <mat-icon>delete</mat-icon>
      <span>{{ strings.DELETE }}</span>
    </button>
  </mat-menu>
</span>

@if (pending === 'saving') {
  <app-busy-overlay></app-busy-overlay>
}
