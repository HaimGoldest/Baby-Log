@if (measurements().length > 0) {
  <mat-card
    appearance="outlined"
    class="measurements-table"
    role="table"
    [attr.aria-label]="strings.TABLE_LABEL"
  >
    <div class="table-header" role="row">
      <span role="columnheader">{{ strings.DATE }}</span>
      <span class="metric-header" role="columnheader">
        <span class="metric-name">{{ strings.WEIGHT }}</span>
        <span class="metric-unit">{{ strings.UNIT_KG }}</span>
      </span>
      <span class="metric-header" role="columnheader">
        <span class="metric-name">{{ strings.HEIGHT }}</span>
        <span class="metric-unit">{{ strings.UNIT_CM }}</span>
      </span>
      <span class="metric-header" role="columnheader">
        <span class="metric-name">{{ strings.HEAD }}</span>
        <span class="metric-unit">{{ strings.UNIT_CM }}</span>
      </span>
      <span role="columnheader" [attr.aria-label]="strings.ACTIONS"></span>
    </div>

    @for (measurement of measurements(); track measurement.uid) {
      <app-growth-tracking-list-item
        [measurement]="measurement"
      ></app-growth-tracking-list-item>
    }
  </mat-card>
} @else {
  <app-alert-message
    type="info"
    [title]="strings.NO_MEASURMENTS_FOUND"
    [message]="strings.ADD_NEW_MEASURMENTS"
  ></app-alert-message>
}
