@if (isLoggedIn()) {
  <mat-toolbar class="app-toolbar">
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="strings.MENU"
    >
      <mat-icon>menu</mat-icon>
    </button>

    @if (baby(); as currentBaby) {
      <a class="baby-chip" [routerLink]="['/', babyEventsPage]">
        @if (babyImageUrl(); as imageUrl) {
          <img
            class="avatar"
            [src]="imageUrl"
            alt=""
            (error)="onImageError(imageUrl)"
          />
        } @else {
          <span class="avatar avatar-placeholder" aria-hidden="true">
            <mat-icon>child_care</mat-icon>
          </span>
        }
        <span class="baby-name">{{ currentBaby.name }}</span>
      </a>
    }
  </mat-toolbar>

  <mat-menu #menu="matMenu">
    <div class="menu-user">
      @if (userImageUrl(); as imageUrl) {
        <img
          class="avatar"
          [src]="imageUrl"
          alt=""
          (error)="onImageError(imageUrl)"
        />
      } @else {
        <span class="avatar avatar-placeholder" aria-hidden="true">
          <mat-icon>person</mat-icon>
        </span>
      }
      <span class="menu-user-name">{{ userName() }}</span>
    </div>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      [routerLink]="['/', babyEventsPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      <mat-icon>event_note</mat-icon>
      <span>{{ strings.BABY_EVENTS }}</span>
    </button>
    <button
      mat-menu-item
      [routerLink]="['/', growthTrackingPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      <mat-icon>show_chart</mat-icon>
      <span>{{ strings.GROWTH_TRACKING }}</span>
    </button>
    <!-- Placeholder for an upcoming feature: listed, but not yet available. -->
    <button mat-menu-item disabled>
      <mat-icon>emoji_events</mat-icon>
      <span>{{ strings.MILESTONES }}</span>
    </button>
    <button
      mat-menu-item
      [routerLink]="['/', babyInfoPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      <mat-icon>child_care</mat-icon>
      <span>{{ strings.BABY_INFO }}</span>
    </button>
    <button
      mat-menu-item
      [routerLink]="['/', addBabyPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="userHaveBabies()"
    >
      <mat-icon>add_circle_outline</mat-icon>
      <span>{{ strings.ADD_BABY }}</span>
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      [routerLink]="['/', babyEventPreferencesPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      <mat-icon>tune</mat-icon>
      <span>{{ strings.PREFERENCES }}</span>
    </button>

    <mat-divider></mat-divider>

    <button mat-menu-item (click)="logout()">
      <mat-icon class="mirror-in-rtl">logout</mat-icon>
      <span>{{ strings.LOGOUT }}</span>
    </button>
  </mat-menu>
}
