@if (isLoggedIn()) {
  <mat-toolbar class="app-toolbar">
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="strings.MENU"
    >
      <mat-icon>menu</mat-icon>
    </button>

    @if (baby(); as currentBaby) {
      <a class="baby-chip" [routerLink]="['/', babyEventsPage]">
        @if (babyImageUrl(); as imageUrl) {
          <img
            class="avatar"
            [src]="imageUrl"
            alt=""
            (error)="onImageError(imageUrl)"
          />
        } @else {
          <span class="avatar avatar-placeholder" aria-hidden="true">
            <mat-icon>child_care</mat-icon>
          </span>
        }
        <span class="baby-name">{{ currentBaby.name }}</span>
      </a>
    }
  </mat-toolbar>

  <mat-menu #menu="matMenu">
    <div class="menu-user">
      @if (userImageUrl(); as imageUrl) {
        <img
          class="avatar"
          [src]="imageUrl"
          alt=""
          (error)="onImageError(imageUrl)"
        />
      } @else {
        <span class="avatar avatar-placeholder" aria-hidden="true">
          <mat-icon>person</mat-icon>
        </span>
      }
      <span class="menu-user-name">{{ userName() }}</span>
    </div>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      [routerLink]="['/', babyEventsPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      {{ strings.BABY_EVENTS }}
    </button>
    <button
      mat-menu-item
      [routerLink]="['/', babyEventPreferencesPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      {{ strings.PREFERENCES }}
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      [routerLink]="['/', growthTrackingPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      {{ strings.GROWTH_TRACKING }}
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      [routerLink]="['/', babyInfoPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="!userHaveBabies()"
    >
      {{ strings.BABY_INFO }}
    </button>
    <button
      mat-menu-item
      [routerLink]="['/', addBabyPage]"
      routerLinkActive="menu-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [disabled]="userHaveBabies()"
    >
      {{ strings.ADD_BABY }}
    </button>

    <mat-divider></mat-divider>

    <!-- Temporary switcher until a theme picker lands in the redesign. -->
    <button mat-menu-item (click)="cycleTheme()">
      <mat-icon>palette</mat-icon>
      <span>{{ strings.CYCLE_THEME }}</span>
    </button>
    <button mat-menu-item (click)="logout()">{{ strings.LOGOUT }}</button>
  </mat-menu>
}
